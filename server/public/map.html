<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备位置追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0f1420; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #map { height: 100%; }
  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(16, 22, 36, .92); color: #e6ebf5;
    border: 1px solid #2a3752; border-radius: 12px;
    padding: 12px 16px; min-width: 270px; max-width: 90vw;
    backdrop-filter: blur(6px); box-shadow: 0 4px 24px rgba(0,0,0,.4);
    font-size: 13px; line-height: 1.7;
  }
  .row { display: flex; justify-content: space-between; gap: 18px; }
  .row .k { color: #8b97ad; }
  .row .v { color: #e6ebf5; font-variant-numeric: tabular-nums; text-align: right; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.on  { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .dot.off { background: #f87171; box-shadow: 0 0 8px #f87171; }
  .state-on  { color: #34d399; font-weight: 600; }
  .state-off { color: #f87171; font-weight: 700; }
  .btns { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    background: rgba(16,22,36,.92); color: #cdd6e4; border: 1px solid #2a3752;
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; min-width: 88px;
  }
  .btn:hover:not(:disabled) { border-color: #4f8cff; color: #fff; }
  .btn.active { border-color: #4f8cff; color: #4f8cff; }
  .btn:disabled { opacity: .55; cursor: wait; }
  select.btn { min-width: 118px; appearance: none; text-align: center; }
  select.btn option { background: #101624; }
  .footer { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a3752; color: #64748b; font-size: 11px; }
  .err { color: #f87171; }
  #toast {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2000;
    background: rgba(16,22,36,.95); border: 1px solid #2a3752; border-radius: 10px;
    color: #e6ebf5; padding: 10px 20px; font-size: 13px; display: none; max-width: 86vw; text-align: center;
  }
  #toast.err { border-color: #7f1d1d; color: #fca5a5; }
  /* v2.4.3 运行控制浮层: 默认隐藏, 点[⚙ 运行控制]展开, 展开时临时盖住状态卡(z-index 更高) */
  #cfgPanel { z-index: 1100; display: none; }
  #cfgPanel .cfg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #cfgPanel .cfg-close { background: none; border: none; color: #8b97ad; font-size: 13px; cursor: pointer; padding: 2px 6px; }
  #cfgPanel .cfg-close:hover { color: #fff; }
  #cfgPanel input[type="time"] {
    color-scheme: dark; background: #0d1322; color: #e6ebf5;
    border: 1px solid #2a3752; border-radius: 6px; padding: 4px 6px; font-size: 13px;
  }
  #cfgPanel .cfg-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">正在加载…</div>
<div class="btns">
  <button class="btn" id="btnLocate" title="让手机立即上报一次最新位置（通常 0.5~1 分钟，夜间/周末休眠期无响应）">获取位置</button>
  <button class="btn" id="btnNav" title="跳转 Google 地图导航到目标最新位置" disabled>Google 导航</button>
  <button class="btn active" id="btnFollow" title="自动跟随最新位置">跟随</button>
  <button class="btn" id="btnCenter" title="居中到最新位置">居中</button>
  <button class="btn" id="btnMe" title="标注我的位置（浏览器定位，不可用时退回IP粗定位）">我的位置</button>
  <button class="btn" id="btnReload" title="重新拉取全部轨迹">刷新全量</button>
  <button class="btn active" id="btnLowAcc" title="隐藏精度较差(>150m)的轨迹段">隐藏低精度</button>
  <select class="btn" id="selInterval" title="地图自动刷新间隔">
    <option value="5">5 秒刷新</option>
    <option value="10">10 秒刷新</option>
    <option value="15">15 秒刷新</option>
    <option value="30">30 秒刷新</option>
    <option value="60">60 秒刷新</option>
    <option value="custom">自定义…</option>
  </select>
  <button class="btn" id="btnCfg" title="展开/收起运行控制面板（总开关、工作时段、运行日）">⚙ 运行控制</button>
</div>
<div class="panel" id="cfgPanel">
  <div class="cfg-head">
    <b>运行控制</b>
    <button class="cfg-close" id="btnCfgClose" title="收起设置面板">✕ 收起</button>
  </div>
  <div class="cfg-line">
    开关 <select class="btn" id="cfgEnabled"><option value="1">开</option><option value="0">关</option></select>
    时段 <input type="time" id="cfgStart" value="08:00"> ~ <input type="time" id="cfgEnd" value="20:00">
  </div>
  <div class="cfg-line">运行日 <span id="cfgDays"></span></div>
  <div class="cfg-line">
    <button class="btn" id="btnCfgSave">保存</button>
    <span id="cfgInfo" style="color:#64748b"></span>
  </div>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var token = qs.get('token') || '';
  var panel = document.getElementById('panel');
  if (!token) {
    panel.innerHTML = '<span class="err">缺少 token 参数。<br>用法：/map?token=你的访问令牌[&interval=秒]</span>';
    return;
  }

  var HB_OFFLINE_MS = 12 * 60 * 1000;  // 心跳超过12分钟判定失联 (v2.4.2: 休眠期10分钟探活粒度)
  var DEFAULT_INTERVAL = 15;            // 默认刷新秒数, 可被 URL/localStorage 覆盖
  var LOCATE_TIMEOUT_MS = 90 * 1000;    // 获取位置按钮超时 (v2.4.1 轮询间隙 25s, 预留 90s)
  var LOCATE_POLL_MS = 2000;

  var map = L.map('map', { zoomControl: true }).setView([35.0, 105.0], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var track = [];
  var lastTs = null;
  var heartbeat = null;   // {device, last_seen, last_report}
  var firstLoad = true;
  var follow = true;
  var marker = null;
  var circle = null;
  var hideLowAcc = true;
  var polyGood = L.polyline([], { color: '#4f8cff', weight: 3, opacity: .75 }).addTo(map);
  var polyBad = L.polyline([], { color: '#64748b', weight: 2, opacity: .3, dashArray: '4 6' }).addTo(map);
  var timer = null;

  map.on('dragstart', function () { setFollow(false); });

  /* ---------- 刷新间隔 ---------- */
  var selInterval = document.getElementById('selInterval');
  function applyInterval(sec) {
    sec = Math.max(1, Math.min(300, sec));
    localStorage.setItem('pollInterval', String(sec));
    if (timer) clearInterval(timer);
    timer = setInterval(refresh, sec * 1000);
  }
  selInterval.onchange = function () {
    if (selInterval.value === 'custom') {
      var v = prompt('刷新间隔（秒，1~300）：', localStorage.getItem('pollInterval') || DEFAULT_INTERVAL);
      if (v === null) { selInterval.value = 'custom'; return; }
      var n = parseInt(v, 10);
      if (!Number.isFinite(n) || n < 1 || n > 300) { toast('间隔须为 1~300 秒', true); selInterval.value = 'custom'; return; }
      applyInterval(n);
      toast('已切换为 ' + n + ' 秒刷新');
    } else {
      applyInterval(parseInt(selInterval.value, 10));
    }
  };
  (function initInterval() {
    var fromUrl = parseInt(qs.get('interval'), 10);
    var saved = parseInt(localStorage.getItem('pollInterval'), 10);
    var sec = Number.isFinite(fromUrl) ? fromUrl : (Number.isFinite(saved) ? saved : DEFAULT_INTERVAL);
    var found = false;
    [].forEach.call(selInterval.options, function (o) { if (parseInt(o.value, 10) === sec) { selInterval.value = o.value; found = true; } });
    if (!found) selInterval.value = 'custom';
    applyInterval(sec);
  })();

  /* ---------- 运行控制 (v2.4.2: 地图端改窗口/开关, 手机轮询应答自动生效) ---------- */
  var DAY_NAMES = ['一', '二', '三', '四', '五', '六', '日'];
  var cfgEnabled = document.getElementById('cfgEnabled');
  var cfgStart = document.getElementById('cfgStart');
  var cfgEnd = document.getElementById('cfgEnd');
  var cfgInfo = document.getElementById('cfgInfo');
  var dayBoxes = [];
  (function buildDayBoxes() {
    var host = document.getElementById('cfgDays');
    DAY_NAMES.forEach(function (n, i) {
      var lbl = document.createElement('label');
      lbl.style.marginRight = '6px';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = String(i + 1);
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(n));
      host.appendChild(lbl);
      dayBoxes.push(cb);
    });
  })();
  function cfgDaysFromBoxes() {
    return dayBoxes.filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; }).join(',');
  }
  function cfgBoxesFromDays(spec) {
    var set = {};
    String(spec || '').split(',').forEach(function (part) {
      part = part.trim();
      if (!part) return;
      if (part.indexOf('-') >= 0) {
        var a = parseInt(part.split('-')[0], 10), b = parseInt(part.split('-')[1], 10);
        for (var d = a; d <= b; d++) set[d] = true;
      } else set[parseInt(part, 10)] = true;
    });
    dayBoxes.forEach(function (cb) { cb.checked = !!set[parseInt(cb.value, 10)]; });
  }
  function hhmmToMin(v) {
    var p = String(v || '').split(':');
    var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
    if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
    return h * 60 + m;
  }
  function minToHHmm(m) {
    function p(n) { return n < 10 ? '0' + n : n; }
    return p(Math.floor(m / 60)) + ':' + p(m % 60);
  }
  function daysLabel() {
    var names = dayBoxes.filter(function (cb) { return cb.checked; }).map(function (cb) { return DAY_NAMES[parseInt(cb.value, 10) - 1]; });
    return names.length === 7 ? '每天' : (names.join('') || '无');
  }
  function renderCfgInfo(enabled) {
    cfgInfo.textContent = enabled
      ? '当前: 运行 ' + cfgStart.value + '~' + cfgEnd.value + ' ' + daysLabel()
      : '当前: 定位已停用 (手机保留10分钟探活)';
  }
  function loadCfg() {
    fetch('/api/config?token=' + encodeURIComponent(token) + '&device=' + encodeURIComponent(currentDevice()))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) {
        if (!c) { toast('读取运行配置失败', true); return; }
        cfgLoaded = true;
        cfgEnabled.value = c.enabled ? '1' : '0';
        cfgStart.value = minToHHmm(c.work_start);
        cfgEnd.value = minToHHmm(c.work_end);
        cfgBoxesFromDays(c.work_days);
        renderCfgInfo(c.enabled);
      })
      .catch(function () {});
  }
  var cfgPanel = document.getElementById('cfgPanel');
  var cfgLoaded = false;
  document.getElementById('btnCfg').onclick = function () {
    if (cfgPanel.style.display === 'block') cfgPanel.style.display = 'none';
    else {
      cfgPanel.style.display = 'block';
      if (!cfgLoaded) loadCfg();
    }
  };
  document.getElementById('btnCfgClose').onclick = function () { cfgPanel.style.display = 'none'; };
  document.getElementById('btnCfgSave').onclick = function () {
    var s = hhmmToMin(cfgStart.value), e = hhmmToMin(cfgEnd.value);
    if (s === null || e === null || s >= e) { toast('开始须早于结束（暂不支持跨午夜）', true); return; }
    var days = cfgDaysFromBoxes();
    if (!days) { toast('至少勾选一个运行日', true); return; }
    fetch('/api/config?token=' + encodeURIComponent(token) + '&device=' + encodeURIComponent(currentDevice()), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: cfgEnabled.value === '1', work_start: s, work_end: e, work_days: days })
    })
      .then(function (r) {
        return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.error || '保存失败 HTTP ' + r.status); });
      })
      .then(function (j) {
        toast('已保存，手机 32 秒内生效（休眠期 ≤10 分钟）');
        renderCfgInfo(j.enabled);
        cfgPanel.style.display = 'none';
      })
      .catch(function (er) { toast(er.message || '保存失败', true); });
  };

  /* ---------- 按钮 ---------- */
  function setFollow(v) {
    follow = v;
    document.getElementById('btnFollow').classList.toggle('active', v);
  }
  document.getElementById('btnFollow').onclick = function () { setFollow(!follow); if (follow) recenter(); };
  document.getElementById('btnCenter').onclick = recenter;
  document.getElementById('btnReload').onclick = function () {
    track = []; lastTs = null; firstLoad = true;
    polyGood.setLatLngs([]);
    polyBad.setLatLngs([]);
    if (marker) { map.removeLayer(marker); marker = null; }
    if (circle) { map.removeLayer(circle); circle = null; }
    refresh();
  };
  function isLow(r) { return r.accuracy != null && r.accuracy > 150; }
  document.getElementById('btnLowAcc').onclick = function () {
    hideLowAcc = !hideLowAcc;
    document.getElementById('btnLowAcc').classList.toggle('active', hideLowAcc);
    render();
  };

  /* ---------- 我的位置 + Google 导航 ---------- */
  var meLat = null, meLng = null, meMarker = null;
  var btnNav = document.getElementById('btnNav');
  document.getElementById('btnMe').onclick = function () {
    if (navigator.geolocation) {
      toast('正在获取我的位置…');
      navigator.geolocation.getCurrentPosition(function (pos) {
        setMe(pos.coords.latitude, pos.coords.longitude, '浏览器定位');
      }, function () { ipLocate(); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    } else ipLocate();
  };
  function ipLocate() {
    toast('浏览器定位不可用，改用 IP 粗定位…');
    fetch('https://ipapi.co/json/')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.latitude && j.longitude) setMe(j.latitude, j.longitude, 'IP 粗定位');
        else toast('无法获取我的位置', true);
      })
      .catch(function () { toast('IP 定位失败', true); });
  }
  function setMe(lat, lng, src) {
    meLat = lat; meLng = lng;
    if (!meMarker) {
      meMarker = L.circleMarker([lat, lng], {
        radius: 8, color: '#fff', weight: 2, fillColor: '#34d399', fillOpacity: 1
      }).addTo(map);
    }
    meMarker.setLatLng([lat, lng]);
    meMarker.bindPopup('<b>我的位置</b><br>来源: ' + esc(src));
    toast('我的位置已标注 (' + src + ')');
    renderStatus();
  }
  btnNav.onclick = function () {
    var l = track[track.length - 1];
    if (!l) { toast('还没有目标位置', true); return; }
    window.open('https://www.google.com/maps/dir/?api=1&destination=' + l.lat + ',' + l.lng, '_blank');
  };
  function distKm(a, b) {
    var R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLng = (b[1] - a[1]) * Math.PI / 180;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
  }

  /* ---------- 获取位置（主动模式） ---------- */
  var btnLocate = document.getElementById('btnLocate');
  btnLocate.onclick = function () {
    btnLocate.disabled = true;
    btnLocate.textContent = '已发送，等待手机…';
    fetch('/api/command?token=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: currentDevice() })
    })
      .then(function (r) { if (!r.ok) throw new Error('创建命令失败 HTTP ' + r.status); return r.json(); })
      .then(function (cmd) {
        if (!cmd.id) throw new Error('创建命令失败');
        toast('命令已排队，手机通常 0.5~1 分钟内响应');
        pollCmd(cmd.id, Date.now() + LOCATE_TIMEOUT_MS);
      })
      .catch(function (e) { resetLocateBtn(); toast(e.message, true); });
  };
  function pollCmd(id, deadline) {
    fetch('/api/command?token=' + encodeURIComponent(token) + '&id=' + id + '&device=' + encodeURIComponent(currentDevice()))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var st = j.command && j.command.status;
        if (st === 'done') {
          resetLocateBtn();
          toast('已获取最新位置');
          refresh(true);
          return;
        }
        if (st === 'expired') {
          resetLocateBtn();
          toast('手机未响应：可能离线或后台被清理，请稍后重试', true);
          return;
        }
        if (Date.now() > deadline) {
          resetLocateBtn();
          toast('等待超时（' + LOCATE_TIMEOUT_MS / 1000 + '秒），手机可能离线', true);
          return;
        }
        setTimeout(function () { pollCmd(id, deadline); }, LOCATE_POLL_MS);
      })
      .catch(function () {
        if (Date.now() > deadline) { resetLocateBtn(); toast('等待超时，手机可能离线', true); }
        else setTimeout(function () { pollCmd(id, deadline); }, LOCATE_POLL_MS);
      });
  }
  function resetLocateBtn() {
    btnLocate.disabled = false;
    btnLocate.textContent = '获取位置';
  }

  /* ---------- 工具 ---------- */
  function currentDevice() { return track.length ? (track[track.length - 1].device || 'primary') : (heartbeat && heartbeat.device) || 'primary'; }
  function recenter() {
    if (track.length) {
      var l = track[track.length - 1];
      map.setView([l.lat, l.lng], Math.max(map.getZoom(), 16));
    }
  }
  function esc(s) { var d = document.createElement('i'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function ago(ts) {
    var s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 10) return '刚刚';
    if (s < 60) return Math.round(s) + ' 秒前';
    if (s < 3600) return Math.round(s / 60) + ' 分钟前';
    if (s < 86400) return Math.round(s / 3600) + ' 小时前';
    return Math.round(s / 86400) + ' 天前';
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, isErr ? 6000 : 3000);
  }

  /* ---------- 渲染 ---------- */
  function render() {
    btnNav.disabled = !track.length;
    if (!track.length) return;
    var pts = [], good = [], bad = [];
    track.forEach(function (r) {
      pts.push([r.lat, r.lng]);
      if (isLow(r)) bad.push([r.lat, r.lng]); else good.push([r.lat, r.lng]);
    });
    polyGood.setLatLngs(good);
    polyBad.setLatLngs(bad);
    if (hideLowAcc) { if (map.hasLayer(polyBad)) map.removeLayer(polyBad); }
    else { if (!map.hasLayer(polyBad)) map.addLayer(polyBad); }
    var last = track[track.length - 1];

    if (!marker) {
      marker = L.circleMarker([last.lat, last.lng], {
        radius: 8, color: '#fff', weight: 2, fillColor: '#4f8cff', fillOpacity: 1
      }).addTo(map);
      marker.bindPopup(function () {
        var l = track[track.length - 1];
        return '<b>' + esc(l.device || 'primary') + '</b><br>时间: ' + esc(fmtTime(l.ts)) +
          '<br>来源: ' + esc(l.provider || '-') + ' · 精度 ±' + esc(l.accuracy != null ? Math.round(l.accuracy) + ' m' : '未知') +
          (l.battery != null ? '<br>电量: ' + Math.round(l.battery) + '%' : '') +
          (l.charging != null ? '<br>充电: ' + (l.charging ? '是' : '否') : '') +
          (l.ssid ? '<br>Wi-Fi: ' + esc(l.ssid) : '');
      });
    }
    marker.setLatLng([last.lat, last.lng]);

    if (last.accuracy != null && last.accuracy > 0) {
      if (!circle) circle = L.circle([last.lat, last.lng], {
        radius: last.accuracy, color: '#4f8cff', weight: 1, fillOpacity: .08
      }).addTo(map);
      circle.setLatLng([last.lat, last.lng]).setRadius(last.accuracy);
    }

    if (firstLoad) {
      map.fitBounds(L.latLngBounds(pts).pad(0.2));
      firstLoad = false;
    }
    if (follow && !firstLoad) recenter();
  }

  function renderStatus() {
    var hbAge = heartbeat && heartbeat.last_seen ? Date.now() - new Date(heartbeat.last_seen).getTime() : null;
    var online = hbAge !== null && hbAge < HB_OFFLINE_MS;
    var l = track[track.length - 1];

    var html = '';
    if (hbAge === null) {
      html += '<div class="row"><span class="k"><span class="dot off"></span>状态</span><span class="v state-off">从未上线</span></div>';
    } else {
      html += '<div class="row"><span class="k"><span class="dot ' + (online ? 'on' : 'off') + '"></span>状态</span><span class="v ' + (online ? 'state-on' : 'state-off') + '">' + (online ? '在线' : '失联') + '</span></div>';
      html += '<div class="row"><span class="k">心跳</span><span class="v">' + esc(ago(heartbeat.last_seen)) + '</span></div>';
    }
    if (l) {
      html += '<div class="row"><span class="k">设备</span><span class="v">' + esc(l.device || 'primary') + '</span></div>';
      html += '<div class="row"><span class="k">最后轨迹点</span><span class="v">' + esc(ago(l.ts)) + '</span></div>';
      if (meLat != null) {
        var dk = distKm([meLat, meLng], [l.lat, l.lng]);
        html += '<div class="row"><span class="k">与我相距</span><span class="v">' + (dk < 1 ? Math.round(dk * 1000) + ' m' : dk.toFixed(2) + ' km') + '</span></div>';
      }
      if (l.battery != null) html += '<div class="row"><span class="k">电量</span><span class="v">' + Math.round(l.battery) + '%' + (l.battery <= 20 ? ' ⚠' : '') + '</span></div>';
      if (l.charging != null) html += '<div class="row"><span class="k">充电</span><span class="v">' + (l.charging ? '⚡ 充电中' : '未充电') + '</span></div>';
      if (l.ssid) html += '<div class="row"><span class="k">Wi-Fi</span><span class="v">' + esc(l.ssid) + '</span></div>';
      html += '<div class="row"><span class="k">定位来源</span><span class="v">' + esc(l.provider || '-') + ' · ±' + esc(l.accuracy != null ? Math.round(l.accuracy) + 'm' : '?') + '</span></div>';
      html += '<div class="row"><span class="k">轨迹点数</span><span class="v">' + track.length + '</span></div>';
      html += '<div class="footer">轨迹点时间: ' + esc(fmtTime(l.ts)) + '</div>';
    } else {
      html += '<div class="row"><span class="k">轨迹</span><span class="v err">暂无上报记录</span></div>';
    }
    panel.innerHTML = html;
  }

  function renderError(msg) {
    panel.innerHTML = '<span class="err">' + esc(msg) + '</span>';
  }

  /* ---------- 数据拉取 ---------- */
  function fetchTrack() {
    var url = '/api/locations?token=' + encodeURIComponent(token) + '&limit=500';
    if (lastTs) url += '&since=' + encodeURIComponent(lastTs);
    return fetch(url)
      .then(function (r) {
        if (r.status === 401) throw new Error('访问令牌无效');
        if (!r.ok) throw new Error('加载失败 HTTP ' + r.status);
        return r.json();
      })
      .then(function (rows) {
        if (rows.length) {
          for (var i = 0; i < rows.length; i++) {
            if (!lastTs || new Date(rows[i].ts) > new Date(lastTs)) track.push(rows[i]);
          }
          lastTs = rows[rows.length - 1].ts;
          render();
        }
      });
  }
  function fetchHeartbeat() {
    return fetch('/api/command?token=' + encodeURIComponent(token) + '&device=' + encodeURIComponent(currentDevice()))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.heartbeat) heartbeat = j.heartbeat; })
      .catch(function () {});
  }

  function refresh(afterLocate) {
    Promise.all([fetchTrack(), fetchHeartbeat()])
      .then(function () {
        renderStatus();
        if (afterLocate) recenter();
      })
      .catch(function (e) { renderError(e.message); });
  }

  refresh();
})();
</script>
</body>
</html>
